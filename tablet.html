<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Light Bridge · Yard setup</title>
<style>:root{color-scheme:dark;font:16px system-ui;background:#0b0f17;color:#eaeef8}body{margin:0;padding:16px}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0 auto 0 0}button{min-height:48px;padding:10px 18px;background:#65558d;color:white;border:1px solid #8f7bb7;border-radius:10px;font:inherit}button:disabled{opacity:.45}#map{height:65vh;min-height:300px;position:relative;background:repeating-linear-gradient(0deg,transparent 0 39px,#263244 40px),repeating-linear-gradient(90deg,#101723 0 39px,#263244 40px);border:1px solid #48546b;border-radius:12px;touch-action:none;margin:16px 0}.light{position:absolute;transform:translate(-50%,-50%);min-width:68px;max-width:140px;font-size:12px;touch-action:none;padding:8px}.selected{outline:3px solid white}#status{min-height:24px;color:#c9b9ee}#details{font-size:14px;color:#aab8cf}a{color:#cbb4ff}</style>
<header><h1>Yard setup</h1><button id="mode">Start identify mode</button><button id="exitMode" hidden>Exit identify mode</button><button id="identify" disabled>Identify selected light</button></header>
<p id="status">Connecting…</p><div id="map" aria-label="Light layout"></div><p id="details">Start identify mode to turn all added lights off. Tap a light to illuminate only that light; drag to place it. Exit restores controller states.</p>
<script>
let token=location.hash.slice(1)||sessionStorage.getItem('lightbridge-pairing');if(token)sessionStorage.setItem('lightbridge-pairing',token);history.replaceState(null,'',location.pathname);
let layout=null,selected=null,drag=null,busy=false;
const $=id=>document.getElementById(id);
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-LightBridge-Pairing':token||''},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error);return data;}
function render(){if(drag)return;$('map').replaceChildren();for(const f of layout.lights){const b=document.createElement('button');b.className='light'+(selected===f.key?' selected':'');b.textContent=f.name;b.style.left=f.x+'%';b.style.top=f.y+'%';b.title=f.model;b.onpointerdown=e=>{if(busy)return;e.preventDefault();selected=f.key;drag={f,b,startX:e.clientX,startY:e.clientY,moved:false};b.setPointerCapture(e.pointerId);$('identify').disabled=false;$('details').textContent=f.name+' · '+f.model+' · '+f.deviceId;};b.onpointermove=e=>{if(!drag||drag.b!==b)return;const r=$('map').getBoundingClientRect();if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<4&&!drag.moved)return;drag.moved=true;f.x=Math.max(5,Math.min(95,(e.clientX-r.left)/r.width*100));f.y=Math.max(8,Math.min(92,(e.clientY-r.top)/r.height*100));b.style.left=f.x+'%';b.style.top=f.y+'%';};b.onpointerup=async()=>{if(!drag)return;const moved=drag.moved;drag=null;try{if(moved){layout=await api('/move',{key:f.key,x:f.x,y:f.y,revision:layout.revision,projectId:layout.projectId});$('status').textContent='Position saved';}else if(layout.identifying){await identifySelected();}render();}catch(e){$('status').textContent=e.message;await refresh();}};b.onpointercancel=()=>{drag=null;refresh()};$('map').append(b);}}
async function refresh(){if(drag||busy)return;try{layout=await api('/layout');render();$('mode').hidden=layout.identifying;$('exitMode').hidden=!layout.identifying;$('status').textContent=layout.identifying?'Identify mode · only the selected light stays on':layout.lights.length+' lights · start identify mode to darken them';}catch(e){$('status').textContent=e.message}}
$('mode').onclick=async()=>{if(busy)return;busy=true;try{layout=await api('/identify/start',{});selected=null;$('identify').disabled=true;$('status').textContent='All lights off. Tap the light you want to identify.';render();}catch(e){$('status').textContent=e.message}finally{busy=false;await refresh()}};
$('exitMode').onclick=async()=>{if(busy)return;busy=true;try{await api('/identify/end',{});$('status').textContent='Identify mode ended; controller states restored.';}catch(e){$('status').textContent=e.message}finally{busy=false;await refresh()}};
async function identifySelected(){if(!selected||busy)return;busy=true;$('identify').disabled=true;$('status').textContent='Darkening other lights…';try{await api('/identify',{key:selected});layout.identifying=true;$('mode').hidden=true;$('exitMode').hidden=false;$('status').textContent='Only the selected light is on. Tap another light to switch.';}catch(e){$('status').textContent=e.message}finally{busy=false;$('identify').disabled=false}}
$('identify').onclick=identifySelected;
refresh();setInterval(refresh,5000);
</script></html>
